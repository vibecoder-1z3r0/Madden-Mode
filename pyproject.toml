[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "madden-mode"
version = "0.1.0"
description = "Telestration over your favorite game/window."
requires-python = ">=3.13"
dependencies = [
    "pyside6>=6.12,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.9.0",
    "mypy>=1.13.0",
]

[project.gui-scripts]
madden-mode = "maddenmode.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/maddenmode"]

[tool.ruff]
target-version = "py313"
line-length = 88
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.mypy]
python_version = "3.13"
disallow_untyped_defs = true
check_untyped_defs = true
warn_return_any = true
ignore_missing_imports = true
explicit_package_bases = true
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
